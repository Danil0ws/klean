[package]
name = "klean"
version = "0.1.3"
edition = "2021"
authors = ["danil0ws"]
description = "A safe, efficient, and extensible CLI tool for cleaning development environments"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danil0ws/klean"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.4"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
fs_extra = "1.3"
rayon = "1.8"
indicatif = "0.17"
ratatui = "0.28"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = "0.3"
humansize = "2.1"
chrono = "0.4"
once_cell = "1.19"
regex = "1.10"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = true
strip = true

# Package metadata for the Linux packages built by the release workflow.
# Without these blocks `cargo deb` / `cargo generate-rpm` ship an empty package.
[package.metadata.deb]
name = "klean"
maintainer = "danil0ws <danil0ws@users.noreply.github.com>"
copyright = "2024, klean contributors"
license-file = ["LICENSE", "4"]
extended-description = """\
klean removes build artifacts, caches and dependency directories (node_modules,
target, .venv, dist, ...) for 20+ languages. It reports one directory per
artifact and can gate deletion per project through klean.toml."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/klean", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/klean/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "klean"
license = "MIT OR Apache-2.0"
summary = "Safe, efficient CLI for cleaning development environments"
url = "https://github.com/danil0ws/klean"
assets = [
    { source = "target/release/klean", dest = "/usr/bin/klean", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/klean/README.md", mode = "644" },
]
