name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: klean
            use_cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary_name: klean
            use_cross: true

          # macOS builds
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: klean
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: klean
            use_cross: false

          # Windows builds
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: klean.exe
            use_cross: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: |
          strip "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" || true

      - name: Create artifact directory
        run: mkdir -p artifacts

      # Asset names are the contract every package manager workflow downloads.
      # Do not change them without updating homebrew/scoop/chocolatey/winget.
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" artifacts/
          cd artifacts
          tar czf "klean-${{ env.VERSION }}-${{ matrix.target }}.tar.gz" "${{ matrix.binary_name }}"
          rm "${{ matrix.binary_name }}"
        shell: bash

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          copy "target\\${{ matrix.target }}\\release\\${{ matrix.binary_name }}" artifacts\\
          cd artifacts
          7z a "klean-${{ env.VERSION }}-${{ matrix.target }}.zip" "${{ matrix.binary_name }}"
          del "${{ matrix.binary_name }}"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: klean-${{ matrix.target }}
          path: artifacts/
          retention-days: 1

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "version=${{ env.VERSION }}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -l release-assets

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: release-assets/SHA256SUMS
          retention-days: 30

  publish-crates-io:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Keep Cargo.toml version in sync with the tag
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          grep '^version' Cargo.toml

      - name: Check if this version is already on crates.io
        id: published
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          VERSION="${VERSION#v}"
          if curl -sf "https://crates.io/api/v1/crates/klean/${VERSION}" > /dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.published.outputs.already == 'false'
        run: cargo publish --token ${{ secrets.CARGO_TOKEN }} --allow-dirty

  # ---------------------------------------------------------------------------
  # Package managers.
  #
  # Each of these is a reusable workflow (on: workflow_call) invoked directly by
  # this release, instead of `gh workflow run` + polling. The old dispatcher
  # needed extra token scopes and had already silently dropped a job
  # (windows-packages.yml was never wired up, so Chocolatey/winget/mise never
  # ran).
  # ---------------------------------------------------------------------------
  update-homebrew:
    name: Homebrew tap
    needs: create-release
    uses: ./.github/workflows/homebrew-update.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  update-scoop:
    name: Scoop bucket
    needs: create-release
    uses: ./.github/workflows/scoop-update.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  update-aur:
    name: AUR
    needs: create-release
    uses: ./.github/workflows/aur-update.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  update-linux-packages:
    name: Linux packages (deb / rpm / Arch)
    needs: create-release
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  update-windows-packages:
    name: Windows packages (Chocolatey / winget / mise)
    needs: create-release
    uses: ./.github/workflows/windows-packages.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
