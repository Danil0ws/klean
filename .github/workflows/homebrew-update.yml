name: Update Homebrew

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: 'Version to publish (e.g., v1.0.0)'

jobs:
  update-homebrew:
    name: Update tap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-klean
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-klean

      - name: Update formula
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          cd homebrew-klean
          mkdir -p Formula

          # A tap formula is just a downloader: both macOS assets carry a
          # prebuilt binary, so the formula never builds from source.
          for arch in x86_64 aarch64; do
            curl -fsSL -o "/tmp/klean-${arch}.tar.gz" \
              "https://github.com/danil0ws/klean/releases/download/v${VERSION}/klean-v${VERSION}-${arch}-apple-darwin.tar.gz"
          done
          SHA_X86=$(sha256sum /tmp/klean-x86_64.tar.gz | awk '{print $1}')
          SHA_ARM=$(sha256sum /tmp/klean-aarch64.tar.gz | awk '{print $1}')

          cat > Formula/klean.rb <<EOF
          class Klean < Formula
            desc "Safe, efficient CLI for cleaning development environments"
            homepage "https://github.com/danil0ws/klean"
            # Asset names contain the target triple, so set the version explicitly.
            version "${VERSION}"
            license "MIT OR Apache-2.0"

            if Hardware::CPU.arm?
              url "https://github.com/danil0ws/klean/releases/download/v${VERSION}/klean-v${VERSION}-aarch64-apple-darwin.tar.gz"
              sha256 "${SHA_ARM}"
            else
              url "https://github.com/danil0ws/klean/releases/download/v${VERSION}/klean-v${VERSION}-x86_64-apple-darwin.tar.gz"
              sha256 "${SHA_X86}"
            end

            depends_on :macos

            def install
              bin.install "klean"
            end

            test do
              assert_match "klean", shell_output("#{bin}/klean --version")
            end
          end
          EOF

          # Keep a licence file next to the formula (tap repos need one).
          cp ../LICENSE LICENSE 2>/dev/null || true

          git config user.name "klean bot"
          git config user.email "bot@klean.local"
          git add -A
          git commit -m "klean ${VERSION}" || echo "nothing to commit"
          git push

  test-homebrew:
    name: Test formula
    runs-on: macos-14
    needs: update-homebrew
    steps:
      - name: Install from the tap
        run: |
          set -euo pipefail
          brew tap ${{ github.repository_owner }}/klean
          brew install klean
          klean --version
          klean --help

      - name: Uninstall
        if: always()
        run: |
          brew uninstall klean || true
          brew untap ${{ github.repository_owner }}/klean || true
