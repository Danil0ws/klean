name: Build Linux Packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: 'Version to publish (e.g., v1.0.0)'

jobs:
  build-deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          # Package metadata lives in [package.metadata.deb] (Cargo.toml).
          sed -i "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          cargo deb --release
          ls -l target/debian/*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: target/debian/*.deb
          retention-days: 1

  build-rpm:
    name: Build .rpm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools
        run: |
          set -euo pipefail
          # rpmbuild is used by cargo-generate-rpm for the payload inspection.
          sudo apt-get update
          sudo apt-get install -y rpm
          cargo install cargo-generate-rpm --locked

      - name: Build .rpm
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          # Package metadata lives in [package.metadata.generate-rpm] (Cargo.toml).
          sed -i "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          cargo build --release
          cargo generate-rpm
          ls -l target/generate-rpm/*.rpm

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: target/generate-rpm/*.rpm
          retention-days: 1

  build-arch:
    name: Build PKGBUILD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create PKGBUILD
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          mkdir -p pkgbuild
          curl -fsSL -o /tmp/klean-source.tar.gz \
            "https://github.com/danil0ws/klean/archive/v${VERSION}.tar.gz"
          SHA256=$(sha256sum /tmp/klean-source.tar.gz | awk '{print $1}')
          rm -f /tmp/klean-source.tar.gz

          cat > pkgbuild/PKGBUILD <<EOF
          # Maintainer: klean contributors
          pkgname=klean
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="Safe, efficient CLI for cleaning development environments"
          arch=('x86_64' 'aarch64')
          url="https://github.com/danil0ws/klean"
          license=('MIT' 'Apache')
          makedepends=('rust' 'cargo')
          source=("https://github.com/danil0ws/klean/archive/v\${pkgver}.tar.gz")
          sha256sums=('${SHA256}')

          build() {
              cd "klean-\${pkgver}"
              cargo build --release --locked
          }

          package() {
              cd "klean-\${pkgver}"
              install -Dm755 target/release/klean "\$pkgdir/usr/bin/klean"
              install -Dm644 README.md "\$pkgdir/usr/share/doc/klean/README.md"
              install -Dm644 LICENSE "\$pkgdir/usr/share/licenses/klean/LICENSE"
          }
          EOF

          cat pkgbuild/PKGBUILD

      - name: Upload PKGBUILD
        uses: actions/upload-artifact@v4
        with:
          name: arch-pkgbuild
          path: pkgbuild/PKGBUILD
          retention-days: 1

  publish-to-packagecloud:
    name: Publish to Packagecloud
    runs-on: ubuntu-latest
    needs: [build-deb, build-rpm]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Install packagecloud CLI
        run: gem install packagecloud-ruby

      - name: Publish .deb
        run: |
          find packages -name "*.deb" -exec \
            packagecloud push "${{ secrets.PACKAGECLOUD_REPO }}/ubuntu/jammy" {} \;
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        continue-on-error: true

      - name: Publish .rpm
        run: |
          find packages -name "*.rpm" -exec \
            packagecloud push "${{ secrets.PACKAGECLOUD_REPO }}/el/9" {} \;
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        continue-on-error: true

  upload-to-release:
    name: Upload packages to Release
    runs-on: ubuntu-latest
    needs: [build-deb, build-rpm, build-arch]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/**/*.deb
            packages/**/*.rpm
            packages/arch-pkgbuild/PKGBUILD
          tag_name: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
