name: Update Scoop

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: 'Version to publish (e.g., v1.0.0)'

jobs:
  update-scoop:
    name: Update bucket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Scoop bucket
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket
          fetch-depth: 0

      - name: Generate manifest
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          cd scoop-bucket
          mkdir -p bucket

          # Windows x86_64
          curl -fsSL -o /tmp/klean-win.zip \
            "https://github.com/danil0ws/klean/releases/download/v${VERSION}/klean-v${VERSION}-x86_64-pc-windows-msvc.zip"
          WIN_HASH=$(sha256sum /tmp/klean-win.zip | awk '{print $1}')
          rm -f /tmp/klean-win.zip

          cat > bucket/klean.json <<EOF
          {
              "version": "${VERSION}",
              "description": "Safe, efficient CLI for cleaning development environments",
              "homepage": "https://github.com/danil0ws/klean",
              "license": "MIT OR Apache-2.0",
              "url": "https://github.com/danil0ws/klean/releases/download/v${VERSION}/klean-v${VERSION}-x86_64-pc-windows-msvc.zip",
              "hash": "${WIN_HASH}",
              "bin": "klean.exe",
              "checkver": "github",
              "autoupdate": {
                  "url": "https://github.com/danil0ws/klean/releases/download/v\$version/klean-v\$version-x86_64-pc-windows-msvc.zip"
              }
          }
          EOF

          python3 -m json.tool bucket/klean.json > /dev/null && echo "manifest is valid JSON"

          git config user.name "klean bot"
          git config user.email "bot@klean.local"
          git add bucket/klean.json
          git commit -m "klean ${VERSION}" || echo "nothing to commit"
          git push

  validate-scoop:
    name: Validate manifest
    runs-on: windows-latest
    needs: update-scoop
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          & "$env:USERPROFILE\scoop\shims\scoop.cmd" --version

      - name: Install from the bucket and run
        shell: pwsh
        run: |
          $scoop = "$env:USERPROFILE\scoop\shims\scoop.cmd"
          & $scoop bucket add kleanlocal "$PWD"
          & $scoop install klean
          & "$env:USERPROFILE\scoop\shims\klean.exe" --version
          & "$env:USERPROFILE\scoop\shims\klean.exe" --help
