name: Update Windows Package Managers

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: 'Version to publish (e.g., v1.0.0)'

jobs:
  # ---------------------------------------------------------------------------
  # Chocolatey. Runs on Windows: the previous version ran on ubuntu and tried to
  # bootstrap the Windows-only Chocolatey installer with powershell, and it wrote
  # the install script from a *quoted* heredoc, so ${VERSION}/${SHA256} reached
  # the .ps1 as literal placeholders (a package that installs nothing).
  # ---------------------------------------------------------------------------
  update-chocolatey:
    name: Chocolatey
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Chocolatey repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/chocolatey-klean
          token: ${{ secrets.CHOCO_REPO_TOKEN }}
          path: choco-repo

      - name: Generate package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ inputs.version }}' -replace '^v', ''
          $url = "https://github.com/danil0ws/klean/releases/download/v$version/klean-v$version-x86_64-pc-windows-msvc.zip"

          $zip = Join-Path $env:RUNNER_TEMP 'klean.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $sha = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()

          Push-Location choco-repo
          New-Item -ItemType Directory -Force -Path tools, legal | Out-Null

          $nuspec = @'
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>klean</id>
              <version>__VERSION__</version>
              <title>klean</title>
              <authors>klean contributors</authors>
              <owners>klean</owners>
              <projectUrl>https://github.com/danil0ws/klean</projectUrl>
              <licenseUrl>https://github.com/danil0ws/klean/blob/main/LICENSE</licenseUrl>
              <projectSourceUrl>https://github.com/danil0ws/klean</projectSourceUrl>
              <docsUrl>https://github.com/danil0ws/klean/blob/main/README.md</docsUrl>
              <bugTrackerUrl>https://github.com/danil0ws/klean/issues</bugTrackerUrl>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <description>
          klean is a CLI that safely removes build artifacts, caches and dependency
          directories (node_modules, target, .venv, dist, ...) for 20+ languages.
          It scans one directory per artifact (never recursing into a match) and can
          manage deletion per project through klean.toml.
              </description>
              <summary>Safe, efficient CLI for cleaning development environments</summary>
              <tags>cleaning development build cache artifacts developer-tools</tags>
              <copyright>2024 klean contributors</copyright>
              <releaseNotes>https://github.com/danil0ws/klean/releases/tag/v__VERSION__</releaseNotes>
            </metadata>
            <files>
              <file src="legal\**" target="legal" />
              <file src="tools\**" target="tools" />
            </files>
          </package>
          '@
          $nuspec.Replace('__VERSION__', $version) | Set-Content -Path klean.nuspec -Encoding UTF8

          $install = @'
          $ErrorActionPreference = 'Stop'

          $toolsDir = Split-Path -Parent $MyInvocation.MyCommand.Definition

          Install-ChocolateyZipPackage `
            -PackageName 'klean' `
            -Url '__URL__' `
            -UnzipLocation $toolsDir `
            -Checksum '__SHA__' `
            -ChecksumType 'sha256'
          '@
          $install.Replace('__URL__', $url).Replace('__SHA__', $sha) |
            Set-Content -Path tools\chocolateyinstall.ps1 -Encoding UTF8

          @'
          # Nothing to do: the shim and the binary live in the package's tools dir.
          '@ | Set-Content -Path tools\chocolateyuninstall.ps1 -Encoding UTF8

          Copy-Item -Path ..\LICENSE -Destination legal\LICENSE.txt -Force
          Pop-Location

      - name: Pack and push
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global --add safe.directory '*'
          Push-Location choco-repo

          choco pack klean.nuspec
          $nupkg = Get-ChildItem -Filter '*.nupkg' | Select-Object -First 1
          if (-not $nupkg) { throw 'choco pack produced no .nupkg' }
          Write-Host "Packed $($nupkg.Name)"

          choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
          Pop-Location

      - name: Commit and push
        shell: pwsh
        run: |
          Push-Location choco-repo
          git config user.name "klean bot"
          git config user.email "bot@klean.local"
          git add klean.nuspec tools legal
          git commit -m "klean ${{ inputs.version }}" || echo "nothing to commit"
          git push
          Pop-Location

  # ---------------------------------------------------------------------------
  # winget: zip + NestedInstallerType portable (winget rejects a bare zip
  # installer without it), and the locale manifest heredoc is unquoted now so
  # ${DOTVERSION} actually expands.
  # ---------------------------------------------------------------------------
  update-winget:
    name: winget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare WinGet manifest
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          MANIFEST_DIR="winget-manifest/manifests/k/klean/klean/${VERSION}"
          mkdir -p "${MANIFEST_DIR}"
          cd "${MANIFEST_DIR}"

          curl -fsSL -o /tmp/klean.zip \
            "https://github.com/danil0ws/klean/releases/download/v${VERSION}/klean-v${VERSION}-x86_64-pc-windows-msvc.zip"
          SHA256=$(sha256sum /tmp/klean.zip | awk '{print $1}')

          cat > klean.installer.yaml <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
          PackageIdentifier: klean.klean
          PackageVersion: ${VERSION}
          InstallerLocale: en-US
          Installers:
          - Architecture: x64
            InstallerType: zip
            NestedInstallerType: portable
            NestedInstallerFiles:
            - RelativeFilePath: klean.exe
              PortableCommandAlias: klean
            InstallerUrl: https://github.com/danil0ws/klean/releases/download/v${VERSION}/klean-v${VERSION}-x86_64-pc-windows-msvc.zip
            InstallerSha256: ${SHA256}
          ManifestType: installer
          ManifestVersion: 1.6.0
          EOF

          cat > klean.locale.en-US.yaml <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.defaultLocale.1.6.0.schema.json
          PackageIdentifier: klean.klean
          PackageVersion: ${VERSION}
          PackageLocale: en-US
          Publisher: klean contributors
          PublisherUrl: https://github.com/danil0ws/klean
          PublisherSupportUrl: https://github.com/danil0ws/klean/issues
          PackageName: klean
          PackageUrl: https://github.com/danil0ws/klean
          License: MIT OR Apache-2.0
          LicenseUrl: https://github.com/danil0ws/klean/blob/main/LICENSE
          ShortDescription: Safe, efficient CLI for cleaning development environments
          Description: |-
            klean safely removes build artifacts, caches and dependency directories
            (node_modules, target, .venv, dist, ...) for 20+ languages.
          Tags:
          - development
          - build
          - cache
          - cleanup
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          EOF

          cat > klean.yaml <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.version.1.6.0.schema.json
          PackageIdentifier: klean.klean
          PackageVersion: ${VERSION}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          EOF

          rm -f /tmp/klean.zip

      - name: Validate manifest
        run: |
          set -euo pipefail
          # winget is Windows-only, but the wingetcreate image can validate YAML
          # off-Windows via the schema URLs; a missing validator is not fatal.
          python3 -c "
          import glob, sys, json, urllib.request
          try:
              import yaml  # type: ignore
          except ImportError:
              print('PyYAML not available, skipping local validation'); sys.exit(0)
          for f in glob.glob('winget-manifest/**/*.yaml', recursive=True):
              yaml.safe_load(open(f))
              print('ok', f)
          "

      - name: Create Pull Request to winget-pkgs
        uses: peter-evans/create-pull-request@v7
        with:
          repository: microsoft/winget-pkgs
          token: ${{ secrets.WINGET_TOKEN }}
          commit-message: 'New version: klean.klean version ${{ inputs.version }}'
          title: 'New version: klean.klean version ${{ inputs.version }}'
          body: |
            This PR adds or updates the klean package for Windows Package Manager (winget).

            - Version: ${{ inputs.version }}
            - Repository: danil0ws/klean
          branch: klean-${{ inputs.version }}
          delete-branch: true
          base: master
          path: winget-manifest
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # mise / asdf: an "exec" plugin is just four shell scripts. Generate them
  # instead of expecting a repo that someone has to hand-write first.
  # ---------------------------------------------------------------------------
  mise-plugin:
    name: mise / asdf plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mise-klean
          token: ${{ secrets.MISE_PLUGIN_TOKEN }}
          path: mise-plugin

      - name: Generate plugin scripts
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          cd mise-plugin
          mkdir -p bin

          # Plugin scripts live in the main repo so there is a single copy to
          # keep working (examples/package-managers/mise).
          cp ../examples/package-managers/mise/plugin.toml plugin.toml
          cp ../examples/package-managers/mise/bin/* bin/
          chmod +x bin/list-all bin/latest-version bin/download bin/install

          cat > README.md <<EOF
          # mise-klean

          [mise](https://mise.jdx.dev) / [asdf](https://asdf-vm.com) plugin for
          [klean](https://github.com/danil0ws/klean).

          \`\`\`bash
          mise plugin add klean https://github.com/${GITHUB_REPOSITORY_OWNER}/mise-klean
          mise install klean@latest
          klean --version
          \`\`\`

          With asdf:

          \`\`\`bash
          asdf plugin add klean https://github.com/${GITHUB_REPOSITORY_OWNER}/mise-klean
          asdf install klean latest
          asdf set klean latest
          \`\`\`

          Last published version: ${VERSION}
          EOF

          echo "KLEAN_VERSION='${VERSION}'" > VERSION

          git config user.name "klean bot"
          git config user.email "bot@klean.local"
          git add -A
          git commit -m "klean ${VERSION}" || echo "nothing to commit"
          git push

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [update-chocolatey, update-winget, mise-plugin]
    if: always()
    steps:
      - name: Report
        run: |
          echo "Chocolatey: ${{ needs.update-chocolatey.result }}"
          echo "winget:     ${{ needs.update-winget.result }} (PR, non-fatal)"
          echo "mise/asdf:  ${{ needs.mise-plugin.result }}"
