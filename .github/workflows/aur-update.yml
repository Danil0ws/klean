name: Update AUR

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: 'Version to publish (e.g., v1.0.0)'

jobs:
  update-aur:
    name: Update AUR package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH for AUR
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

      - name: Clone AUR repository
        run: |
          set -euo pipefail
          git clone ssh://aur@aur.archlinux.org/klean.git aur-klean

      - name: Update PKGBUILD and .SRCINFO
        run: |
          set -euo pipefail
          cd aur-klean

          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          # Builds from the tagged source tarball, so the checksum comes from it.
          curl -fsSL -o /tmp/klean-source.tar.gz \
            "https://github.com/danil0ws/klean/archive/v${VERSION}.tar.gz"
          SHA256=$(sha256sum /tmp/klean-source.tar.gz | awk '{print $1}')
          rm -f /tmp/klean-source.tar.gz

          cat > PKGBUILD <<EOF
          # Maintainer: klean contributors
          pkgname=klean
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="Safe, efficient CLI for cleaning development environments"
          arch=('x86_64' 'aarch64')
          url="https://github.com/danil0ws/klean"
          license=('MIT' 'Apache')
          makedepends=('rust' 'cargo')
          source=("https://github.com/danil0ws/klean/archive/v\${pkgver}.tar.gz")
          sha256sums=('${SHA256}')

          build() {
              cd "klean-\${pkgver}"
              cargo build --release --locked
          }

          package() {
              cd "klean-\${pkgver}"
              install -Dm755 target/release/klean "\$pkgdir/usr/bin/klean"
              install -Dm644 README.md "\$pkgdir/usr/share/doc/klean/README.md"
              install -Dm644 LICENSE "\$pkgdir/usr/share/licenses/klean/LICENSE"
          }
          EOF

          # .SRCINFO is normally produced by `makepkg --printsrcinfo`, which needs
          # base-devel (unavailable on ubuntu runners), so emit it directly.
          cat > .SRCINFO <<EOF
          pkgbase = klean
          	pkgdesc = Safe, efficient CLI for cleaning development environments
          	pkgver = ${VERSION}
          	pkgrel = 1
          	url = https://github.com/danil0ws/klean
          	arch = x86_64
          	arch = aarch64
          	license = MIT
          	license = Apache
          	makedepends = rust
          	makedepends = cargo
          	source = https://github.com/danil0ws/klean/archive/v${VERSION}.tar.gz
          	sha256sums = ${SHA256}

          pkgname = klean
          EOF

      - name: Push to AUR
        run: |
          set -euo pipefail
          cd aur-klean

          git config user.name "klean bot"
          git config user.email "bot@aur.archlinux.org"
          git add PKGBUILD .SRCINFO
          git commit -m "klean ${{ inputs.version }}" || echo "nothing to commit"
          git push
