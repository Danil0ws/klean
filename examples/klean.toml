# klean.toml - Global configuration
# Location: ~/.config/klean/config.toml or ./klean.toml (project-specific)

# ============================================================================
# BACKUP SETTINGS
# ============================================================================

# Move artifacts to this directory instead of permanently deleting them
# If not set, artifacts are permanently deleted
backup_dir = "/home/user/.klean-backups"

# ============================================================================
# IGNORE SETTINGS
# ============================================================================

# Respect .gitignore files in scanned directories
# Default: true
respect_gitignore = true

# ============================================================================
# CUSTOM ARTIFACT PATTERNS
# ============================================================================

# Define custom artifact patterns for your project
# These are added to the default patterns

[[patterns]]
name = "gradle_cache"
patterns = [".gradle"]
languages = ["Java", "Kotlin"]
description = "Gradle build cache directory"
safe_to_delete = true

[[patterns]]
name = "npm_cache"
patterns = [".npm", "npm-cache"]
languages = ["JavaScript", "TypeScript"]
description = "NPM package cache"
safe_to_delete = true

[[patterns]]
name = "custom_temp"
patterns = [".temp", "tmp", "temporary"]
languages = ["Generic"]
description = "Custom temporary files"
safe_to_delete = true

# ============================================================================
# PROJECT MANAGEMENT
# ============================================================================
#
# klean groups results by project (the nearest ancestor of an artifact that
# contains a marker file: package.json, Cargo.toml, go.mod, .git, ...).
# Rules decide what may be deleted inside a project; the most specific rule
# (longest matching path) wins. Artifacts blocked by a rule are reported as
# skipped, never deleted.

[[projects]]
# Project root: absolute path, `~/...` or a glob.
path = "~/Work/production-app"
# false = never delete anything inside this project.
enabled = false

[[projects]]
path = "~/Dev/monorepo"
# If set, only these may be deleted here (directory name or pattern name).
allow = ["node_modules", "dist", ".next"]
# Never delete these, even if they match a pattern.
deny = ["target"]

[[projects]]
# Globs work too.
path = "~/sandbox/*"
allow = []          # empty = everything klean finds is allowed

# ============================================================================
# VERBOSITY
# ============================================================================

# Default verbosity level (0 = warn, 1 = info, 2 = debug, 3 = trace)
verbosity = 1

# ============================================================================
# CUSTOM PATTERNS (SIMPLE)
# ============================================================================

# Simple string patterns to include in scanning
custom_patterns = [
    ".DS_Store",          # macOS
    "Thumbs.db",          # Windows
    "*.log",              # Log files
    ".env.local",         # Local environment files
]
